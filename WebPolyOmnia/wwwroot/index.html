<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - PolyOmnia</title>
    <!-- Підключення Bootstrap 5 та Bootstrap Icons відповідно до основного дизайну -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: var(--bg-carbon); color: var(--text-main);">

    <!-- Навігаційна панель у стилі PolyOmnia -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top px-3" style="background-color: #121215; z-index: 1030; border-bottom: 1px solid var(--card-border);">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 py-0" href="#" onclick="    app.navigateTo('categories')">
                <img src="logoa.png"
                     alt="PolyOmnia Logo"
                     class="brand-logo-img"
                     style="height: 32px; width: auto; object-fit: contain;" />
                <img src="text1.png"
                     alt="PolyOmnia"
                     class="brand-text-img d-none d-sm-inline-block"
                     style="height: 20px; width: auto; object-fit: contain;" />
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4 gap-2">
                    <li class="nav-item">
                        <button class="nav-link btn btn-link text-light d-flex align-items-center gap-1" onclick="app.navigateTo('categories')">
                            <i class="bi bi-folder-fill text-warning"></i> Категорії
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link btn btn-link text-light d-flex align-items-center gap-1" onclick="app.navigateTo('users')">
                            <i class="bi bi-person-check-fill text-primary"></i> Користувачі
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link btn btn-link text-light d-flex align-items-center gap-1" onclick="app.navigateTo('videos')">
                            <i class="bi bi-collection-play-fill text-primary"></i> Відео на модерацію
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Основний контейнер контенту SPA -->
    <main id="app-content" class="container my-5">
        <!-- Сюди динамічно завантажуватимуться таблиці, форми та відеоплеєри -->
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Завантаження...</span>
            </div>
        </div>
    </main>

    <!-- Футер -->
    <footer class="border-top border-secondary py-4 mt-auto text-center text-muted" style="border-color: var(--card-border) !important;">
        <p class="mb-1">&copy; 2026 - <strong style="color: var(--electric-indigo, #6366f1)">PolyOmnia</strong>. One Universe. Infinite Stories.</p>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
